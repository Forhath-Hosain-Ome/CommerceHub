---
name: Auto Create Pull Request

'on':
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
      - 'release/**'

permissions:
  pull-requests: write
  contents: read

jobs:
  auto-pr:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Target Branch
        id: target
        run: |
          BRANCH="${{ github.ref_name }}"
          if [[ "$BRANCH" == feature/* ]]; then
            echo "target=develop" >> $GITHUB_OUTPUT
            echo "pr_type=Feature" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" == bugfix/* ]]; then
            echo "target=develop" >> $GITHUB_OUTPUT
            echo "pr_type=Bugfix" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" == hotfix/* ]]; then
            echo "target=master" >> $GITHUB_OUTPUT
            echo "pr_type=Hotfix" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" == release/* ]]; then
            echo "target=master" >> $GITHUB_OUTPUT
            echo "pr_type=Release" >> $GITHUB_OUTPUT
          else
            echo "target=develop" >> $GITHUB_OUTPUT
            echo "pr_type=Release" >> $GITHUB_OUTPUT
          fi

      - name: Check if Target Branch Exists
        id: check-branch
        run: |
          TARGET="${{ steps.target.outputs.target }}"
          if git show-ref --verify --quiet "refs/heads/$TARGET"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Target branch '$TARGET' exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Target branch '$TARGET' doesn't exist yet"
          fi

      - name: Collect Changes
        if: steps.check-branch.outputs.exists == 'true'
        id: changes
        run: |
          TARGET="${{ steps.target.outputs.target }}"
          {
            echo "list<<EOF"
            git log "origin/$TARGET..HEAD" --pretty=format:"- %s" \
              2>/dev/null || echo "New branch, no comparison available"
            echo
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create PR (if target exists)
        if: steps.check-branch.outputs.exists == 'true'
        uses: repo-sync/pull-request@v2
        with:
          destination_branch: ${{ steps.target.outputs.target }}
          pr_title: "${{ steps.target.outputs.pr_type }}: \
            ${{ github.ref_name }}"
          pr_body: |
            ## Automated PR

            Branch: `${{ github.ref_name }}` →
            `${{ steps.target.outputs.target }}`

            ### Changes
            ${{ steps.changes.outputs.list }}

            ### Checklist
            - [ ] Code follows project standards
            - [ ] Tests added/updated
            - [ ] Documentation updated
            - [ ] No breaking changes
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip PR (target doesn't exist)
        if: steps.check-branch.outputs.exists == 'false'
        run: |
          echo "Skipping PR creation - target branch doesn't exist yet"
          echo "This is normal for new projects"
